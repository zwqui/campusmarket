name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the app
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          zip -rq ../../app.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app.zip

  deploy:
    name: Upload to S3 and refresh servers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-bundle
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Upload release to S3
        run: aws s3 cp app.zip s3://${{ secrets.S3_BUCKET }}/releases/app.zip
      - name: Replace servers with the new version
        run: |
          TG=$(aws elbv2 describe-target-groups --names tg-campusmarket \
            --query "TargetGroups[0].TargetGroupArn" --output text)
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=asg-campusmarket" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          for ID in $IDS; do
            echo "Replacing server $ID"
            aws ec2 terminate-instances --instance-ids $ID
            sleep 60
            for i in $(seq 1 40); do
              HEALTHY=$(aws elbv2 describe-target-health --target-group-arn $TG \
                --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])")
              echo "Healthy servers: $HEALTHY"
              if [ "$HEALTHY" -ge 1 ]; then break; fi
              sleep 15
            done
          done

  verify:
    name: Check the app is alive
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call the health endpoint
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.APP_URL }}/api/health"; then exit 0; fi
            echo "Not ready, trying again..."
            sleep 10
          done
          exit 1